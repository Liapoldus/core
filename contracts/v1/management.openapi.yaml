openapi: 3.1.1
info:
  title: Liapoldus Management API
  version: 1.0.0
  description: Нормативный control-plane API Liapoldus. На loopback требует Bearer service key; вне loopback требует TLS, mTLS и Bearer service key.
servers:
  - url: http://127.0.0.1:9090
  - url: https://management.example.com:9443
security:
  - bearerAuth: []
x-liapoldus-remote-security:
  required:
    - mtls
    - bearerAuth
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { $ref: '#/components/responses/Problem' }
  /api/status:
    get:
      operationId: getStatus
      responses: { '200': { description: Runtime status, content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } } }, '401': { $ref: '#/components/responses/Problem' } }
  /api/config:
    get:
      operationId: getConfig
      responses: { '200': { description: Redacted configuration, content: { application/json: { schema: { $ref: '#/components/schemas/Config' } } } }, '401': { $ref: '#/components/responses/Problem' } }
    put:
      operationId: putConfig
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/yaml: { schema: { type: string } } } }
      responses: { '200': { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/Revision' } } } }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /api/config/validate:
    post:
      operationId: validateConfig
      requestBody: { required: true, content: { application/yaml: { schema: { type: string } } } }
      responses: { '200': { description: Valid, content: { application/json: { schema: { $ref: '#/components/schemas/Validation' } } } }, '422': { $ref: '#/components/responses/Problem' } }
  /api/reload:
    post:
      operationId: reload
      responses: { '200': { description: Reloaded, content: { application/json: { schema: { $ref: '#/components/schemas/Revision' } } } }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /api/sites:
    get:
      operationId: listSites
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Sites, content: { application/json: { schema: { $ref: '#/components/schemas/SiteList' } } } } }
  /api/sites/{slug}/publish:
    post:
      operationId: publishSite
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublishRequest' } } } }
      responses: { '201': { description: Published, content: { application/json: { schema: { $ref: '#/components/schemas/Publication' } } } }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /api/sites/{slug}/rollback:
    post:
      operationId: rollbackSite
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IdempotencyRequest' } } } }
      responses: { '200': { description: Rolled back, content: { application/json: { schema: { $ref: '#/components/schemas/Publication' } } } }, '404': { $ref: '#/components/responses/Problem' } }
  /api/listeners:
    get:
      operationId: listListeners
      responses: { '200': { description: Listeners, content: { application/json: { schema: { $ref: '#/components/schemas/ListenerList' } } } } }
  /api/upstreams:
    get:
      operationId: listUpstreams
      responses: { '200': { description: Upstreams, content: { application/json: { schema: { $ref: '#/components/schemas/UpstreamList' } } } } }
  /api/plugins:
    get:
      operationId: listPlugins
      responses: { '200': { description: Plugins, content: { application/json: { schema: { $ref: '#/components/schemas/PluginList' } } } } }
  /api/plugins/{id}/restart:
    post:
      operationId: restartPlugin
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/OperationReference' } } } }, '404': { $ref: '#/components/responses/Problem' } }
  /api/plugins/{id}/logs:
    get:
      operationId: getPluginLogs
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Logs, content: { application/json: { schema: { $ref: '#/components/schemas/LogList' } } } } }
  /api/tls:
    get:
      operationId: listTls
      responses: { '200': { description: TLS state, content: { application/json: { schema: { $ref: '#/components/schemas/TlsList' } } } } }
  /api/tls/{issuer}/renew:
    post:
      operationId: renewTls
      parameters: [{ $ref: '#/components/parameters/Issuer' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenewRequest' } } } }
      responses: { '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/OperationReference' } } } } }
  /api/tls/{issuer}/revoke:
    post:
      operationId: revokeTls
      parameters: [{ $ref: '#/components/parameters/Issuer' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeRequest' } } } }
      responses: { '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/OperationReference' } } } } }
  /api/operations/{id}:
    get:
      operationId: getOperation
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Operation, content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } } }, '404': { $ref: '#/components/responses/Problem' } }
  /api/audit:
    get:
      operationId: listAudit
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Audit records, content: { application/json: { schema: { $ref: '#/components/schemas/AuditList' } } } } }
  /metrics:
    get:
      operationId: metrics
      responses: { '200': { description: Prometheus exposition, content: { text/plain: { schema: { type: string } } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: lpgw service key }
    mtls: { type: mutualTLS, description: Required together with bearerAuth on non-loopback management listeners. }
  parameters:
    Slug: { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$' } }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Issuer: { name: issuer, in: path, required: true, schema: { type: string } }
    Cursor: { name: cursor, in: query, schema: { type: string, description: Opaque cursor } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: Active snapshot digest }
  responses:
    Problem: { description: RFC 9457 problem, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    RequestId: { type: string, pattern: '^req_[A-Za-z0-9]+$' }
    Health: { type: object, required: [status, requestId], properties: { status: { const: ok }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    Revision: { type: object, required: [revision, digest, requestId], properties: { revision: { type: string }, digest: { type: string }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    Validation: { allOf: [{ $ref: '#/components/schemas/Revision' }, { type: object, required: [valid], properties: { valid: { const: true } } }] }
    Config: { allOf: [{ $ref: '#/components/schemas/Revision' }, { type: object, required: [yaml], properties: { yaml: { type: string } } }] }
    Status: { type: object, required: [revision, digest, listeners, upstreams, plugins, requestId], properties: { revision: { type: string }, digest: { type: string }, listeners: { type: array, items: { $ref: '#/components/schemas/Listener' } }, upstreams: { type: array, items: { $ref: '#/components/schemas/Upstream' } }, plugins: { type: array, items: { $ref: '#/components/schemas/Plugin' } }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    Site: { type: object, required: [name, source, state], properties: { name: { type: string }, source: { enum: [release, directory] }, slug: { type: [string, 'null'] }, root: { type: [string, 'null'] }, currentRevision: { type: [string, 'null'] }, previousRevision: { type: [string, 'null'] }, state: { enum: [ready, invalid, publishing] } } }
    SiteList: { type: object, required: [items, nextCursor, requestId], properties: { items: { type: array, items: { $ref: '#/components/schemas/Site' } }, nextCursor: { type: [string, 'null'] }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    Publication: { type: object, required: [site, revision, previousRevision, requestId], properties: { site: { type: string }, revision: { type: string }, previousRevision: { type: [string, 'null'] }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    PublishRequest: { type: object, additionalProperties: false, required: [source, idempotencyKey], properties: { source: { type: string }, idempotencyKey: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' } } }
    IdempotencyRequest: { type: object, additionalProperties: false, required: [idempotencyKey], properties: { idempotencyKey: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' } } }
    Listener: { type: object, required: [name, type, address, state, activeConnections], properties: { name: { type: string }, type: { enum: [http, tcp, udp] }, address: { type: string }, state: { enum: [ready, draining, failed] }, activeConnections: { type: integer, minimum: 0 } } }
    ListenerList: { type: object, required: [items, requestId], properties: { items: { type: array, items: { $ref: '#/components/schemas/Listener' } }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    Upstream: { type: object, required: [name, targets, healthyTargets, state], properties: { name: { type: string }, targets: { type: integer }, healthyTargets: { type: integer }, state: { enum: [healthy, degraded, unavailable] } } }
    UpstreamList: { type: object, required: [items, requestId], properties: { items: { type: array, items: { $ref: '#/components/schemas/Upstream' } }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    Plugin: { type: object, required: [id, state, capabilities, limits, health], properties: { id: { type: string }, state: { enum: [starting, ready, unhealthy, stopped] }, capabilities: { type: array, items: { type: string } }, limits: { type: object }, health: { type: boolean } } }
    PluginList: { type: object, required: [items, requestId], properties: { items: { type: array, items: { $ref: '#/components/schemas/Plugin' } }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    LogList: { type: object, required: [items, nextCursor, requestId], properties: { items: { type: array, items: { type: object } }, nextCursor: { type: [string, 'null'] }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    Tls: { type: object, required: [profile, domain, serial, notAfter, state], properties: { profile: { type: string }, domain: { type: string }, serial: { type: string }, notAfter: { type: string, format: date-time }, state: { enum: [ready, renewing, degraded] } } }
    TlsList: { type: object, required: [items, requestId], properties: { items: { type: array, items: { $ref: '#/components/schemas/Tls' } }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    OperationReference: { type: object, required: [operationId, requestId], properties: { operationId: { type: string }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    Operation: { type: object, required: [id, state, createdAt, requestId], properties: { id: { type: string }, state: { enum: [pending, running, succeeded, failed] }, createdAt: { type: string, format: date-time }, startedAt: { type: [string, 'null'], format: date-time }, finishedAt: { type: [string, 'null'], format: date-time }, result: {}, problem: { $ref: '#/components/schemas/Problem' }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    Audit: { type: object, required: [timestamp, actor, action, resource, result, requestId], properties: { timestamp: { type: string, format: date-time }, actor: { type: string }, action: { type: string }, resource: { type: string }, result: { enum: [succeeded, failed] }, requestId: { $ref: '#/components/schemas/RequestId' }, digestBefore: { type: string }, digestAfter: { type: string } } }
    AuditList: { type: object, required: [items, nextCursor, requestId], properties: { items: { type: array, items: { $ref: '#/components/schemas/Audit' } }, nextCursor: { type: [string, 'null'] }, requestId: { $ref: '#/components/schemas/RequestId' } } }
    RenewRequest: { allOf: [{ $ref: '#/components/schemas/IdempotencyRequest' }, { type: object, properties: { domains: { type: array, items: { type: string } } } }] }
    RevokeRequest: { allOf: [{ $ref: '#/components/schemas/IdempotencyRequest' }, { type: object, required: [serial], properties: { serial: { type: string } } }] }
    Problem: { type: object, required: [type, title, status, code, detail, instance, requestId], properties: { type: { type: string, format: uri }, title: { type: string }, status: { type: integer }, code: { type: string }, detail: { type: string }, instance: { type: string }, requestId: { $ref: '#/components/schemas/RequestId' }, path: { type: string }, diagnostics: { type: array, items: { type: object } } } }
