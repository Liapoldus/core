semantics:
  unusedSite: unused
  overriddenSite: overridden
  defaultLocaleMustBeListed: |
    При наличии defaultLocale его значение должно точно совпадать с одним из locales. Это межполевое правило проверяет Gateway после JSON Schema; $data и иные расширения валидатора не используются.
  managementNonLoopbackTLS: |
    Для не-loopback адреса listener требуется tlsProfile, ссылающийся на запись tlsProfiles с clientAuth.mode=require.
  managementNonLoopbackMTLS: |
    Для не-loopback адреса listener профиль TLS должен требовать клиентский сертификат (clientAuth.mode=require).
  managementStaticTokenNonLoopback: |
    staticToken разрешён только на loopback-адресе listener.
  managementStaticTokenExclusive: |
    staticToken и serviceAccounts взаимоисключающие: нельзя задавать оба.
  managementRemoteRequiresAccount: |
    Для не-loopback адреса listener требуется как минимум один serviceAccounts. Каждый /api запрос также требует Bearer key.
codes:
