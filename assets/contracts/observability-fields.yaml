audit:
  directory: audit
  extension: .jsonl
  retentionDays: 90
  dateLayout: "2006-01-02"
  actors:
    anonymous: anonymous
    staticToken: static-token
  actions:
    configReload: config.reload
    configUpdate: config.update
    sitePublished: site_published
  resources:
    gateway: gateway
  results:
    succeeded: succeeded
    failed: failed
  storageUnavailable:
    code: audit_unavailable
    detail: audit storage is unavailable
operations:
  retention: 24h
  directory: operations
metrics:
  intervalDefault: 15s
  scopeName: liapoldus.gateway
  unit: "1"
  exporterName: otlp
  exportFailureMessage: OpenTelemetry metrics export failed
  invalidIntervalMessage: invalid OTLP metrics interval
  help:
    requestTotal: Gateway HTTP requests.
    requestDuration: Gateway HTTP request duration.
    managementTotal: Management API requests.
    auditRecordsTotal: Audit records written.
    exportFailuresTotal: Telemetry exporter failures.
  names:
    requestTotal: liapoldus_http_requests_total
    requestDuration: liapoldus_http_request_duration_seconds
    managementTotal: liapoldus_management_requests_total
    auditRecordsTotal: liapoldus_audit_records_total
    exportFailuresTotal: liapoldus_otel_export_failures_total
  labels:
    listener: listener
    route: route
    site: site
    method: method
    status: status
    exporter: exporter
    action: action
    result: result
logging:
  formats:
    json: json
  accessDefault:
  - stdout
  accessSinks:
    stdout: stdout
    stderr: stderr
  accessFields:
    requestIDHeader: X-Request-ID
    timestamp: timestamp
    requestID: requestId
    listener: listener
    route: route
    method: method
    host: host
    path: path
    status: status
    duration: duration
    bytes: bytes
tracing:
  samplingParentBased: parent-based
  samplingAlwaysOn: always-on
  samplingAlwaysOff: always-off
  initializationTimeout: 5s
  shutdownTimeout: 5s
  invalidSamplingMessage: invalid tracing sampling mode
  invalidInitializationTimeoutMessage: invalid tracing initialization timeout
  scopeName: liapoldus.gateway
  serviceName: liapoldus.gateway
  serviceNameAttribute: service.name
  spanName: liapoldus.http.server
  exporterName: otlp-traces
  exportFailureMessage: OpenTelemetry traces export failed
  attributes:
    method: http.request.method
    listener: liapoldus.listener
    status: http.response.status_code
redaction:
  - secret
  - cookie
  - authorization
  - token
  - password
  - private-key
  - service-key
  - grant
