version: 3
workdir: .
exclude: [tests, third_party/**, "**/*_test.go"]
allow:
  depOnAnyVendor: false
  deepScan: true
components:
  command: { in: cmd/** }
  domainModels: { in: internal/domain/models }
  domainInterfaces: { in: internal/domain/interfaces }
  application: { in: internal/application }
  infrastructureConfig: { in: internal/infrastructure/config }
  contractAdapter: { in: [.] }
  infrastructureSecurity: { in: internal/infrastructure/security }
  infrastructureStorage: { in: internal/infrastructure/storage }
  infrastructurePlugins: { in: internal/infrastructure/plugins }
  infrastructureArtifacts: { in: internal/infrastructure/artifacts }
  infrastructureCaddy: { in: internal/infrastructure/caddy }
  presentationAPI: { in: internal/presentation/api }
  presentationCLI: { in: internal/presentation/cli }
vendors:
  yaml: { in: [gopkg.in/yaml.v3] }
  jsonschema: { in: [github.com/santhosh-tekuri/jsonschema/v6] }
  bcrypt: { in: [golang.org/x/crypto/bcrypt] }
  pluginprotocol: { in: [github.com/Liapoldus/pluginprotocol, github.com/Liapoldus/pluginprotocol/transport, github.com/Liapoldus/pluginprotocol/pluginv1] }
  protobuf: { in: [google.golang.org/protobuf/proto] }
  gopsutil: { in: [github.com/shirou/gopsutil/v4/process] }
  sqliteDriver: { in: [modernc.org/sqlite] }
  caddy: { in: [github.com/caddyserver/caddy/v2, github.com/caddyserver/caddy/v2/modules/standard] }
  caddyLayer4: { in: [github.com/mholt/caddy-l4] }
  caddyConfig: { in: [github.com/caddyserver/caddy/v2/caddyconfig] }
  caddyHTTP: { in: [github.com/caddyserver/caddy/v2/modules/caddyhttp] }
  caddyHTTPConfig: { in: [github.com/caddyserver/caddy/v2/caddyconfig/httpcaddyfile] }
  googleUUID: { in: [github.com/google/uuid] }
commonComponents: [domainModels]
commonVendors: []
deps:
  command:
    anyProjectDeps: true
    anyVendorDeps: true
  domainModels:
    mayDependOn: [domainModels]
  domainInterfaces:
    mayDependOn: [domainModels]
  application:
    mayDependOn: [domainModels, domainInterfaces]
  infrastructureConfig:
    mayDependOn: [domainModels, domainInterfaces, contractAdapter]
    canUse: [yaml, jsonschema]
  contractAdapter:
    mayDependOn: [domainModels]
  infrastructureSecurity:
    mayDependOn: [domainModels, domainInterfaces]
    canUse: [bcrypt]
  infrastructureStorage:
    mayDependOn: [domainModels, domainInterfaces, contractAdapter]
    canUse: [sqliteDriver, yaml]
  infrastructurePlugins:
    mayDependOn: [domainModels, domainInterfaces]
    canUse: [yaml, jsonschema, bcrypt, pluginprotocol, protobuf, gopsutil]
  infrastructureArtifacts:
    mayDependOn: [domainModels, domainInterfaces]
  infrastructureCaddy:
    mayDependOn: [domainModels, domainInterfaces, contractAdapter, infrastructurePlugins]
    canUse: [caddy, caddyLayer4, caddyConfig, caddyHTTP, caddyHTTPConfig, googleUUID]
  presentationAPI:
    mayDependOn: [application, domainModels, domainInterfaces, infrastructureConfig, infrastructureSecurity, infrastructureStorage, infrastructurePlugins, infrastructureArtifacts]
    canUse: [bcrypt]
  presentationCLI:
    mayDependOn: [application, domainModels, domainInterfaces, infrastructureConfig, infrastructureSecurity, infrastructureStorage, infrastructurePlugins, infrastructureArtifacts, presentationAPI]
