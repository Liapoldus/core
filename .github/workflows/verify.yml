name: Verify Core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - name: Checkout plugin-sdk
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/plugin-sdk
          path: plugin-sdk
      # The manual-core-server fixture builds and starts the real Server and
      # forms-db binaries from their workspace siblings, and the plugin-protocol
      # and SDK replace directives those modules declare resolve from there.
      # Without this layout the suite fails on chdir instead of on behaviour.
      - name: Checkout pluginprotocol
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/pluginprotocol
          path: pluginprotocol
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/server
          path: plugins/server
      - name: Checkout forms-db
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/forms-db
          path: plugins/forms-db
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/tests/package-lock.json
      - name: Build Core
        run: make build
        working-directory: core
      - name: Run TypeScript test suite
        run: npm --prefix tests ci && make test
        working-directory: core
      - name: Go race and shutdown acceptance
        run: make test-race
        working-directory: core
      - name: Docker smoke
        run: make docker-smoke
        working-directory: core
      - name: Enforce architecture
        run: make arch-lint
        working-directory: core
