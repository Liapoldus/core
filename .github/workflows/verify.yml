name: Verify Core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - name: Checkout plugin-sdk
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/plugin-sdk
          path: plugin-sdk
      - name: Checkout pluginprotocol
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/pluginprotocol
          path: pluginprotocol
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
      - name: Configure Core, Plugin SDK, and Plugin Protocol workspace
        run: |
          go work init ./core ./plugin-sdk ./pluginprotocol
          go work edit -go=1.26.0 go.work
          go work edit -replace=github.com/Liapoldus/plugin-sdk/v2@v2.0.0=./plugin-sdk go.work
          go work edit -replace=github.com/Liapoldus/pluginprotocol/v3@v3.0.0=./pluginprotocol go.work
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/tests/package-lock.json
      - name: Build Core
        run: make build
        working-directory: core
      - name: Run TypeScript test suite
        run: npm --prefix tests ci && make test
        working-directory: core
      - name: Go race and shutdown acceptance
        run: make test-race
        working-directory: core
      - name: Docker smoke
        run: make docker-smoke
        working-directory: core
      - name: Enforce architecture
        run: make arch-lint
        working-directory: core
