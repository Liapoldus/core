selectInstances: "SELECT instances.id, instances.mode, instances.state, instances.revision, instances.manifest_json, instances.settings_json, COALESCE(launch.launch_json, '') FROM plugin_instances AS instances LEFT JOIN plugin_launch_settings AS launch ON launch.instance_id = instances.id ORDER BY instances.id"
validModes:
  - local
  - remote
validStates:
  - configured
  - starting
  - ready
  - degraded
  - failed
json:
  id: id
  mode: mode
  state: state
  revision: revision
  capabilities: capabilities
  capabilityDescriptors: capabilityDescriptors
  descriptorCapability: capability
  descriptorModes: modes
diagnostics:
  invalidContract: plugin inventory contract is invalid
  invalidRecord: plugin instance record is invalid
  invalidManifest: plugin instance manifest is invalid
