selectInstances: "SELECT instances.id, instances.state, active.generation, instances.manifest_json, active.raw_json FROM service_instances AS instances JOIN service_config_generations AS active ON active.instance_id = instances.id AND active.slot = 'active' ORDER BY instances.id"
validStates:
  - configured
  - ready
  - degraded
  - failed
json:
  id: id
  state: state
  revision: revision
diagnostics:
  invalidContract: service inventory contract is invalid
  invalidRecord: service instance record is invalid
  invalidManifest: service instance manifest is invalid
