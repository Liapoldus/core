version: 3
workdir: .
exclude: [tests, third_party/**, "**/*_test.go"]
allow:
  depOnAnyVendor: false
  deepScan: true
components:
  command: { in: cmd/** }
  domainModels: { in: internal/domain/models }
  domainInterfaces: { in: internal/domain/interfaces }
  application: { in: internal/application }
  infrastructureConfig: { in: internal/infrastructure/config }
  infrastructureAccounts: { in: internal/infrastructure/accounts }
  infrastructureNetwork: { in: internal/infrastructure/network }
  contractAdapter: { in: [.] }
  infrastructureSecurity: { in: internal/infrastructure/security }
  infrastructureStorage: { in: internal/infrastructure/storage }
  infrastructurePlugins: { in: internal/infrastructure/plugins }
  infrastructureObservability: { in: internal/infrastructure/observability }
  presentationAPI: { in: internal/presentation/api }
  presentationCLI: { in: internal/presentation/cli }
vendors:
  yaml: { in: [gopkg.in/yaml.v3] }
  jsonschema: { in: [github.com/santhosh-tekuri/jsonschema/v6] }
  bcrypt: { in: [golang.org/x/crypto/bcrypt] }
  otel: { in: [go.opentelemetry.io/otel, go.opentelemetry.io/otel/sdk, go.opentelemetry.io/otel/exporters] }
  prometheus: { in: [github.com/prometheus/client_golang/prometheus, github.com/prometheus/client_golang/prometheus/promhttp] }
  prometheusModel: { in: [github.com/prometheus/client_model/go] }
  otelAttribute: { in: [go.opentelemetry.io/otel/attribute] }
  otelMetricExporter: { in: [go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp] }
  otelInstrumentation: { in: [go.opentelemetry.io/otel/sdk/instrumentation] }
  otelMetricData: { in: [go.opentelemetry.io/otel/sdk/metric/metricdata] }
  otelResource: { in: [go.opentelemetry.io/otel/sdk/resource] }
  otelTraceAPI: { in: [go.opentelemetry.io/otel/trace] }
  otelTraceExporter: { in: [go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp] }
  otelTraceSDK: { in: [go.opentelemetry.io/otel/sdk/trace] }
  otelPropagation: { in: [go.opentelemetry.io/otel/propagation] }
  otelCodes: { in: [go.opentelemetry.io/otel/codes] }
  pluginprotocol: { in: [github.com/Liapoldus/pluginprotocol/transport, github.com/Liapoldus/pluginprotocol/pluginv1] }
  protobuf: { in: [google.golang.org/protobuf/proto] }
  maxminddb: { in: [github.com/oschwald/maxminddb-golang/v2] }
  gopsutil: { in: [github.com/shirou/gopsutil/v4/process] }
  quic: { in: [github.com/quic-go/quic-go] }
  quicHTTP3: { in: [github.com/quic-go/quic-go/http3] }
commonComponents: [domainModels]
commonVendors: []
deps:
  command:
    anyProjectDeps: true
    anyVendorDeps: true
  domainModels:
    mayDependOn: [domainModels]
  domainInterfaces:
    mayDependOn: [domainModels]
  application:
    mayDependOn: [domainModels, domainInterfaces]
  infrastructureConfig:
    mayDependOn: [domainModels, domainInterfaces, contractAdapter]
    canUse: [yaml, jsonschema]
  infrastructureAccounts:
    mayDependOn: [domainModels, domainInterfaces]
    canUse: [bcrypt]
  contractAdapter:
    mayDependOn: [domainModels]
  infrastructureNetwork:
    mayDependOn: [domainModels, domainInterfaces, infrastructureObservability, infrastructurePlugins]
    canUse: [quic, quicHTTP3, otelPropagation]
  infrastructureSecurity:
    mayDependOn: [domainModels, domainInterfaces]
    canUse: [bcrypt, maxminddb]
  infrastructureStorage:
    mayDependOn: [domainModels, domainInterfaces]
  infrastructurePlugins:
    mayDependOn: [domainModels, domainInterfaces]
    canUse: [yaml, jsonschema, bcrypt, otel, pluginprotocol, protobuf, gopsutil]
  infrastructureObservability:
    mayDependOn: [domainModels, domainInterfaces]
    canUse: [otel, prometheus, prometheusModel, otelAttribute, otelMetricExporter, otelInstrumentation, otelMetricData, otelResource, otelTraceAPI, otelTraceExporter, otelTraceSDK, otelPropagation, otelCodes]
  presentationAPI:
    mayDependOn: [application, domainModels, domainInterfaces, infrastructureConfig, infrastructureNetwork, infrastructureSecurity, infrastructureStorage, infrastructurePlugins, infrastructureObservability]
    canUse: [bcrypt]
  presentationCLI:
    mayDependOn: [application, domainModels, domainInterfaces, infrastructureConfig, infrastructureNetwork, infrastructureSecurity, infrastructureStorage, infrastructurePlugins, infrastructureObservability, infrastructureAccounts, presentationAPI]
