root:
  - state
  - artifacts
  - execution
  - management
  - pluginCatalog
state:
  - path
artifacts:
  - path
execution:
  - profile
management:
  - listen
  - tls
  - requestLimits
managementBootstrap:
  section: management
  listen: listen
  tls: tls
  clientCA: clientCA
managementTLS:
  - certificate
  - key
  - clientCA
managementRequestLimits:
  - maxBodyBytes
  - headerTimeout
  - requestTimeout
pluginCatalog:
  - url
secretReference:
  filePrefix: "file:"
unknownFieldPolicy: reject
semantics:
  minimalBootstrapOnly: |
    Этот YAML содержит пути state/artifacts, профиль lifecycle, каталог пакетов и Management API bind/TLS/trust. Plugin settings и traffic configuration задаются через API.
  localStorageOnly: |
    SQLite и immutable artifact store размещаются на локальной файловой системе. Сетевые database mounts не поддерживаются.
  managementRemoteSecurity: |
    Вне loopback Management API требует private network/VPN, TLS, mTLS и Bearer service key роли platform-admin.
codes:
  unknownField: unknown_field
  bootstrapInvalid: bootstrap_invalid
