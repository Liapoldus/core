name: Integration scenarios

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: liapoldus_test
          POSTGRES_PASSWORD: codex_test_only
          POSTGRES_DB: forms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liapoldus_test -d forms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: forms_test
          MYSQL_USER: liapoldus_test
          MYSQL_PASSWORD: codex_test_only
          MYSQL_ROOT_PASSWORD: codex_root_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pcodex_root_test_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: forms_test
          MARIADB_USER: liapoldus_test
          MARIADB_PASSWORD: codex_test_only
          MARIADB_ROOT_PASSWORD: codex_root_test_only
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      LIAPOLDUS_V1_E2E_POSTGRES_DSN: postgres://liapoldus_test:codex_test_only@127.0.0.1:5432/forms_test?sslmode=disable
      LIAPOLDUS_V1_E2E_MYSQL_DSN: liapoldus_test:codex_test_only@tcp(127.0.0.1:3306)/forms_test?parseTime=true
      LIAPOLDUS_V1_E2E_MARIADB_DSN: liapoldus_test:codex_test_only@tcp(127.0.0.1:3307)/forms_test?parseTime=true
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      # These scenarios assert facts that live in the repositories next to Core:
      # the fixture builds and starts the real Server and forms-db binaries, and
      # the surface boundary reads forms-db's own contract. Core itself stays
      # plugin-agnostic, which is why this workspace is assembled here and not in
      # the plugin-agnostic Verify Core gate.
      - name: Checkout plugin-sdk
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/plugin-sdk
          path: plugin-sdk
      # pluginprotocol belongs to the two product plugins that speak it, not to
      # Core; their own replace directives resolve it from this sibling.
      - name: Checkout pluginprotocol
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/pluginprotocol
          path: pluginprotocol
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/server
          path: plugins/server
      - name: Checkout forms-db
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/forms-db
          path: plugins/forms-db
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/tests/package-lock.json
      - name: Cross-repository scenarios
        run: npm --prefix tests ci && npm --prefix tests test -- manual-core-server plugin-admin-surface
        working-directory: core
