insertApplicationGroup: "INSERT INTO groups(id, kind) VALUES(?, 'application')"
insertGroupPointer: "INSERT INTO group_pointers(group_id) VALUES(?)"
selectGroup: "SELECT g.id, g.kind, g.active, g.created_at, g.archived_at, p.current_revision_id, p.previous_revision_id FROM groups g LEFT JOIN group_pointers p ON p.group_id = g.id WHERE g.id = ?"
selectGroups: "SELECT g.id, g.kind, g.active, g.created_at, g.archived_at, p.current_revision_id, p.previous_revision_id FROM groups g LEFT JOIN group_pointers p ON p.group_id = g.id ORDER BY g.id ASC"
selectGroupKind: "SELECT kind FROM groups WHERE id = ?"
archiveApplicationGroup: "UPDATE groups SET active = 0, archived_at = COALESCE(archived_at, CURRENT_TIMESTAMP) WHERE id = ? AND kind = 'application'"
insertRevision: "INSERT INTO group_revisions(id, group_id, caddyfile_digest, artifact_digest, caddyfile_path, artifact_path, actor) VALUES(?, ?, ?, ?, ?, ?, ?)"
selectRevision: "SELECT id, group_id, caddyfile_digest, artifact_digest, caddyfile_path, artifact_path, created_at, actor FROM group_revisions WHERE group_id = ? AND id = ?"
selectRevisionsFirstPage: "SELECT id, group_id, caddyfile_digest, artifact_digest, caddyfile_path, artifact_path, created_at, actor FROM group_revisions WHERE group_id = ? ORDER BY created_at DESC, id DESC LIMIT ?"
selectRevisionsAfterCursor: "SELECT id, group_id, caddyfile_digest, artifact_digest, caddyfile_path, artifact_path, created_at, actor FROM group_revisions WHERE group_id = ? AND (created_at < ? OR (created_at = ? AND id < ?)) ORDER BY created_at DESC, id DESC LIMIT ?"
selectRevisionExists: "SELECT EXISTS(SELECT 1 FROM group_revisions WHERE group_id = ? AND id = ?)"
selectGroupExists: "SELECT EXISTS(SELECT 1 FROM groups WHERE id = ?)"
selectPointers: "SELECT group_id, current_revision_id, previous_revision_id, updated_at FROM group_pointers WHERE group_id = ?"
advancePointers: "UPDATE group_pointers SET previous_revision_id = current_revision_id, current_revision_id = ?, updated_at = CURRENT_TIMESTAMP WHERE group_id = ? AND current_revision_id IS ?"
groupNotFound: "The requested group does not exist."
revisionNotFound: "The requested group revision does not exist."
revisionConflict: "The current group revision changed before the update could be committed."
invalidContract: "The SQLite group-store contract is invalid."
systemGroupArchiveRejected: "The system group cannot be archived."
invalidRevisionCursor: "The group revision cursor is invalid."
invalidRevisionLimit: "The group revision page size is invalid."
cursorSeparator: "\u0000"
defaultRevisionLimit: 50
maximumRevisionLimit: 100
applicationGroupKind: application
