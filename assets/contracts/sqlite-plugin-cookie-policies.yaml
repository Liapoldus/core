selectPolicy: "SELECT allowed_names_json, revision FROM plugin_cookie_policies WHERE instance_id = ? AND capability = ?"
selectAllPolicies: "SELECT instance_id, capability, allowed_names_json, revision FROM plugin_cookie_policies ORDER BY instance_id, capability"
selectSupportedCapability: "SELECT EXISTS (SELECT 1 FROM plugin_instances AS instance, json_each(instance.manifest_json, '$.capabilities') AS capability WHERE instance.id = ? AND capability.value = ?)"
insertPolicy: "INSERT OR IGNORE INTO plugin_cookie_policies(instance_id, capability, allowed_names_json, revision, updated_at) VALUES(?, ?, ?, ?, ?)"
updatePolicy: "UPDATE plugin_cookie_policies SET allowed_names_json = ?, revision = ?, updated_at = ? WHERE instance_id = ? AND capability = ? AND revision = ?"
notFound: "Plugin instance or capability was not found."
revisionConflict: "Plugin cookie policy revision does not match."
invalidContract: "Plugin cookie policy storage contract is invalid."
invalidPolicy: "Plugin cookie policy record is invalid."
writeFailure: "Plugin cookie policy could not be persisted."
