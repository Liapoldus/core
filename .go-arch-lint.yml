version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true
components:
  command: { in: cmd/** }
  domain: { in: internal/domain/** }
  application: { in: internal/application/** }
  infrastructure: { in: internal/infrastructure/** }
  presentation: { in: internal/presentation/** }
  assets: { in: assets }
vendors:
  yaml: { in: [gopkg.in/yaml.v3] }
commonVendors: []
commonComponents: [assets]
deps:
  command:
    mayDependOn: [presentation, application, infrastructure]
  domain:
    mayDependOn: []
  application:
    mayDependOn: [domain]
  infrastructure:
    mayDependOn: [domain]
  presentation:
    mayDependOn: [application, domain, infrastructure]
    canUse: [yaml]
