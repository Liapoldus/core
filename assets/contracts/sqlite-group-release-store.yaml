selectIdempotency: "SELECT request_digest, operation_id FROM idempotency WHERE actor = ? AND scope = ? AND key_digest = ? AND expires_at > ?"
deleteExpiredIdempotency: "DELETE FROM idempotency WHERE actor = ? AND scope = ? AND key_digest = ? AND expires_at <= ?"
selectOperation: "SELECT id, kind, state, created_at, updated_at, request_id, actor, resource FROM operations WHERE id = ?"
selectCurrent: "SELECT current_revision_id FROM group_pointers WHERE group_id = ?"
insertOperation: "INSERT INTO operations(id, kind, state, request_id, actor, resource, created_at, updated_at) VALUES(?, ?, ?, ?, ?, ?, ?, ?)"
insertIdempotency: "INSERT INTO idempotency(actor, scope, key_digest, request_digest, operation_id, created_at, expires_at) VALUES(?, ?, ?, ?, ?, ?, ?)"
insertJournal: "INSERT INTO group_release_journal(operation_id, group_id, expected_current_revision_id, revision_id, caddyfile_digest, artifact_digest, caddyfile_path, artifact_path, actor, request_id, state, created_at, updated_at) VALUES(?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)"
insertRevision: "INSERT INTO group_revisions(id, group_id, caddyfile_digest, artifact_digest, caddyfile_path, artifact_path, actor) VALUES(?, ?, ?, ?, ?, ?, ?)"
advancePointers: "UPDATE group_pointers SET previous_revision_id = current_revision_id, current_revision_id = ?, updated_at = CURRENT_TIMESTAMP WHERE group_id = ? AND current_revision_id IS ?"
updateOperation: "UPDATE operations SET state = ?, updated_at = ? WHERE id = ?"
updateJournal: "UPDATE group_release_journal SET state = ?, updated_at = ? WHERE operation_id = ?"
selectPending: "SELECT journal.operation_id, journal.group_id, journal.expected_current_revision_id, journal.revision_id, operation.kind, journal.caddyfile_digest, journal.artifact_digest, journal.caddyfile_path, journal.artifact_path, journal.actor, journal.request_id, journal.created_at, (SELECT expires_at FROM idempotency WHERE operation_id = journal.operation_id) FROM group_release_journal journal JOIN operations operation ON operation.id = journal.operation_id WHERE journal.state = ? ORDER BY journal.created_at"
groupExists: "SELECT EXISTS(SELECT 1 FROM groups WHERE id = ?)"
groupNotFound: "The requested group does not exist."
operationNotFound: "The requested operation does not exist."
revisionConflict: "The current group revision changed before the update could be committed."
idempotencyConflict: "The idempotency key is already associated with different content."
invalidContract: "The SQLite group-release-store contract is invalid."
timestampLayout: "2006-01-02T15:04:05.999999999Z07:00"
pendingState: pending
failedState: failed
