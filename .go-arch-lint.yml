version: 3
workdir: .
exclude: [tests, third_party/**, "**/*_test.go"]
allow:
  depOnAnyVendor: false
  deepScan: true
components:
  command: { in: cmd/** }
  domainModels: { in: internal/domain/models }
  domainInterfaces: { in: internal/domain/interfaces }
  application: { in: internal/application }
  infrastructureConfig: { in: internal/infrastructure/config }
  contractAdapter: { in: [.] }
  infrastructureSecurity: { in: internal/infrastructure/security }
  infrastructureStorage: { in: internal/infrastructure/storage }
  infrastructureSettings: { in: internal/infrastructure/storage/settings }
  infrastructurePlugins: { in: internal/infrastructure/plugins }
  presentationAPI: { in: internal/presentation/api }
  presentationAPIHandlers: { in: internal/presentation/api/handlers }
  runtime: { in: internal/runtime }
vendors:
  yaml: { in: [gopkg.in/yaml.v3] }
  jsonschema: { in: [github.com/santhosh-tekuri/jsonschema/v6] }
  bcrypt: { in: [golang.org/x/crypto/bcrypt] }
  pluginSDK: { in: [github.com/Liapoldus/plugin-sdk, github.com/Liapoldus/plugin-sdk/domain/interfaces, github.com/Liapoldus/plugin-sdk/domain/models, github.com/Liapoldus/plugin-sdk/infrastructure, github.com/Liapoldus/plugin-sdk/presentation] }
  sqliteDriver: { in: [modernc.org/sqlite] }
  textNormalization: { in: [golang.org/x/text/cases, golang.org/x/text/unicode/norm] }
  googleUUID: { in: [github.com/google/uuid] }
commonComponents: [domainModels]
commonVendors: []
deps:
  command:
    anyProjectDeps: true
    anyVendorDeps: true
  domainModels:
    mayDependOn: [domainModels]
  domainInterfaces:
    mayDependOn: [domainModels]
  application:
    mayDependOn: [domainModels, domainInterfaces]
  infrastructureConfig:
    mayDependOn: [domainModels, domainInterfaces, contractAdapter, infrastructureStorage]
    canUse: [yaml, jsonschema]
  contractAdapter:
    mayDependOn: [domainModels]
  infrastructureSecurity:
    mayDependOn: [domainModels, domainInterfaces]
    canUse: [bcrypt]
  infrastructureStorage:
    mayDependOn: [domainModels, domainInterfaces, contractAdapter]
    canUse: [sqliteDriver, yaml]
  infrastructureSettings:
    mayDependOn: [domainModels, domainInterfaces]
    canUse: [sqliteDriver]
  infrastructurePlugins:
    mayDependOn: [domainModels, domainInterfaces]
    canUse: [yaml, jsonschema, bcrypt, pluginSDK]
  presentationAPI:
    mayDependOn: [application, domainModels, domainInterfaces, infrastructureConfig, infrastructureSecurity, infrastructureStorage, infrastructurePlugins, presentationAPIHandlers]
    canUse: [bcrypt, pluginSDK]
  presentationAPIHandlers:
    mayDependOn: [application, domainModels, domainInterfaces, infrastructureConfig, infrastructurePlugins]
    canUse: []
  runtime:
    mayDependOn: [application, domainModels, domainInterfaces, infrastructureConfig, infrastructurePlugins, infrastructureSecurity, infrastructureStorage, infrastructureSettings, presentationAPI]
    canUse: []
