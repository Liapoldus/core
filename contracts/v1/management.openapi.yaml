openapi: 3.1.0
info:
  title: Liapoldus Core Management API
  version: 1.0.0
  description: >-
    Control-plane API единственного Core instance. Plugin instances входят в
    membership через аутентифицированную регистрацию и активные leases;
    Management API не управляет их process/container lifecycle. Desired plugin
    configuration хранится в SQLite и доставляется репликам через Plugin SDK
    REST Reload. Public traffic не проходит через этот API. Caddy
    Admin/group/TLS endpoints отсутствуют.
servers:
  - url: /
security:
  - ServiceBearer: []
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      summary: Проверить процесс Core
      responses:
        '200':
          description: Core process отвечает
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /api/status:
    get:
      operationId: getStatus
      summary: Получить readiness data plane и drift summary
      responses:
        '200':
          description: Текущее состояние control plane
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoreStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/plugins:
    get:
      operationId: listPlugins
      summary: Список подключённых plugin instances
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Metadata без секретов и private keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginList' }
        '400': { $ref: '#/components/responses/InvalidListParameters' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/config-bundles/plan:
    post:
      operationId: planConfigBundle
      summary: Валидировать project config bundle без записи desired state
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigBundleRequest' }
      responses:
        '200':
          description: Read-only plan с текущими revision/digest по services
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigBundlePlanResponse' }
        '422': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/config-bundles/apply:
    post:
      operationId: applyConfigBundle
      summary: Принять bundle и создать Core operations
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigBundleRequest' }
      responses:
        '202':
          description: Service-scoped Core operations созданы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigBundleApplyResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/plugin-links:
    get:
      operationId: listPeerLinkPolicies
      summary: Список Core-owned caller-to-target peer policies
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Durable policies; отсутствие policy означает deny
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeerLinkPolicyList' }
        '400': { $ref: '#/components/responses/InvalidListParameters' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createPeerLinkPolicy
      summary: Создать deny-by-default caller-to-target policy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeerLinkPolicyCreate' }
      responses:
        '201':
          description: Policy сохранена, snapshot и directory watchers обновлены
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeerLinkPolicy' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/plugin-links/{callerInstanceId}/{targetInstanceId}:
    parameters:
      - $ref: '#/components/parameters/CallerInstanceId'
      - $ref: '#/components/parameters/TargetInstanceId'
    get:
      operationId: getPeerLinkPolicy
      summary: Получить policy для logical caller/target пары
      responses:
        '200':
          description: Durable policy и её CAS revision
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeerLinkPolicy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: replacePeerLinkPolicy
      summary: Атомарно заменить набор link rules для пары
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeerLinkPolicyReplace' }
      responses:
        '200':
          description: Новая CAS revision сохранена, directory watchers уведомлены
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeerLinkPolicy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: deletePeerLinkPolicy
      summary: Удалить link policy и отозвать разрешение
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Policy удалена, отсутствие policy означает deny }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/plugins/{pluginId}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      operationId: getPlugin
      summary: Получить plugin instance metadata
      responses:
        '200':
          description: Redacted plugin instance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginInstance' }
        '404': { $ref: '#/components/responses/PluginNotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/plugins/{pluginId}/settings:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      operationId: getPluginSettings
      summary: Получить desired JSON settings и revision
      responses:
        '200':
          description: Versioned plugin config; secret values не возвращаются
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '404': { $ref: '#/components/responses/PluginNotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: applyPluginSettings
      summary: Сохранить desired settings и уведомить реплики через SDK REST Reload
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginSettingsInput' }
      responses:
        '202':
          description: Candidate apply начат; активируется после обязательных ACK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/plugins/{pluginId}/rollback:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    post:
      operationId: rollbackPluginSettings
      summary: Поменять местами active и previous и уведомить plugin через REST Reload
      description: >-
        Rollback — операция Management API, которая меняет местами активное и
        предыдущее durable-генерации и затем уведомляет реплики обычным Reload.
        Запрос не содержит конфигурацию plugin.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Rollback operation создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '404': { $ref: '#/components/responses/PluginNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/plugins/admin-surfaces:
    get:
      operationId: listAdminSurfaces
      summary: Список validated plugin Admin Surface
      responses:
        '200':
          description: Declarative surfaces без executable UI
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSurfaceList' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/plugins/{pluginId}/admin/pages/{page}/query:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - name: page
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/AdminSurfaceDigest'
    post:
      operationId: queryPluginAdminPage
      summary: Выполнить schema-bound Admin Surface query
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Typed JSON query result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/plugins/{pluginId}/admin/pages/{page}/actions/{action}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - name: page
        in: path
        required: true
        schema: { type: string }
      - name: action
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/AdminSurfaceDigest'
      - $ref: '#/components/parameters/PluginActionIfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: executePluginAdminAction
      summary: Выполнить объявленное plugin action
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          multipart/form-data:
            schema:
              type: object
              required: [metadata, artifact]
              properties:
                metadata:
                  type: object
                  description: JSON action input validated by the active Admin Surface schema; the plugin action declares its serialized-byte limit.
                  additionalProperties: true
                artifact:
                  type: string
                  format: binary
                  description: The single artifact declared by this action; Content-Type must match the action declaration and actual bytes are counted while streaming.
            encoding:
              metadata:
                contentType: application/json
              artifact:
                contentType: application/octet-stream
      responses:
        '200':
          description: Typed result for a non-artifact action
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '202':
          description: Durable operation accepted for an artifact action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: Artifact, metadata, multipart envelope, or full request-body byte limit exceeded while streaming
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getOperation
      summary: Получить состояние durable operation
      responses:
        '200':
          description: Operation metadata only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '404': { $ref: '#/components/responses/OperationNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/audit:
    get:
      operationId: listAudit
      summary: Получить cursor page audit events
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Redacted audit page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '400': { $ref: '#/components/responses/InvalidListParameters' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/access/service-keys:
    get:
      operationId: listServiceKeys
      summary: Список metadata service credentials
      responses:
        '200':
          description: Token и verifier не возвращаются
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceKeyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createServiceKey
      summary: Выпустить platform-admin service credential
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceKeyCreateInput' }
      responses:
        '201':
          description: Raw token показывается только один раз
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceKeyIssued' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      description: >-
        Все /api/** operations требуют platform-admin service key поверх TLS.
        Web Controller дополнительно требует mTLS, проверяемый до HTTP; invalid
        client certificate завершает TLS handshake и не возвращает Problem body.
        Bearer token никогда не выдаётся browser. Пользовательские permissions
        остаются в клиентском backend и проверяются до обращения к Core.
  parameters:
    PluginId:
      name: pluginId
      in: path
      required: true
      schema: { type: string }
    CallerInstanceId:
      name: callerInstanceId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    TargetInstanceId:
      name: targetInstanceId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: Strong ETag целевого plugin-owned ресурса; не Admin Surface digest.
    AdminSurfaceDigest:
      name: X-Liapoldus-Admin-Surface-Digest
      in: header
      required: true
      schema: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
      description: Точный digest из активного Admin Surface для plugin instance.
    PluginActionIfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string }
      description: >-
        Resource-level CAS precondition. Required for JSON actions. Multipart
        artifact actions may omit it when creating the first revision; the
        plugin enforces its metadata-level expectedCurrentRevision CAS.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: >-
        Durable mutations and multipart artifact actions deduplicate by actor,
        resource/action and request fingerprint. For synchronous JSON plugin
        Admin Actions this value is correlation/audit metadata only; each
        accepted request invokes the action again.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      description: Размер страницы; по умолчанию 50.
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Непрозрачный URL-safe Base64 cursor, выданный предыдущей страницей.
  responses:
    InvalidRequest:
      description: >-
        400 invalid_request: тело отсутствует, повреждено или не соответствует
        объявленной request schema.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidListParameters:
      description: >-
        400 invalid_pagination для limit вне диапазона 1..100 либо invalid_cursor
        для некорректного cursor или offset за пределами списка.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MethodNotAllowed:
      description: >-
        405 method_not_allowed: HTTP method не разрешён endpoint-ом.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PluginCallFailed:
      description: >-
        502 plugin_call_failed: подробности ошибки плагина клиенту не возвращаются.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: >-
        500 internal_error: безопасная общая ошибка без внутренних деталей.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: >-
        401 management_bearer_required: Bearer credential отсутствует, истёк
        или отозван. Ошибка TLS client certificate возникает до HTTP и не
        имеет Problem response.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: >-
        403 forbidden: Authenticated service identity не имеет требуемой
        роли/права.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: >-
        409 conflict: по операции код может быть plugin_instance_conflict
        или idempotency_conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: >-
        412 precondition failed: If-Match не соответствует актуальной revision;
        код plugin_revision_conflict определяется resource contract.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Invalid:
      description: >-
        422 invalid request/schema. Код берётся из Error Catalog и зависит от
        операции (например plugin_config_invalid или artifact_invalid).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: >-
        404 not_found: запрошенный generic Management API resource не существует.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PluginNotFound:
      description: >-
        404 plugin_not_found: plugin instance не существует.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OperationNotFound:
      description: >-
        404 operation_not_found: durable operation не существует.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: >-
        503 plugin_unavailable, management_unavailable, audit_unavailable,
        activation_failed или resource_exhausted по причине отказа.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Health:
      type: object
      required: [status, requestId]
      properties:
        status: { type: string, enum: [ok] }
        requestId: { type: string }
      additionalProperties: false
    CoreStatus:
      type: object
      required: [drift, dataPlaneReadiness, requestId]
      properties:
        drift: { type: boolean }
        dataPlaneReadiness:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [ready, degraded, recovering, unavailable, 'not-ready'] }
            reason: { type: string }
          additionalProperties: false
        requestId: { type: string }
      additionalProperties: false
    ConfigBundleRequest:
      type: object
      required: [project, bundle, target]
      properties:
        project:
          type: object
          required: [id, revision]
          properties:
            id: { type: string, minLength: 1 }
            repository: { type: string }
            revision: { type: string, minLength: 1 }
          additionalProperties: false
        bundle:
          type: object
          required: [schemaVersion, digest]
          properties:
            schemaVersion: { type: string, const: core-config/v2 }
            digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            services:
              type: array
              uniqueItems: true
              items:
                type: object
                required: [id, settings]
                properties:
                  id: { type: string, minLength: 1 }
                  settings: { type: object, additionalProperties: true }
                additionalProperties: false
            links:
              type: array
              items: { type: object, additionalProperties: true }
          additionalProperties: false
        target:
          type: object
          required: [environment]
          properties:
            environment: { type: string, minLength: 1 }
            expectedGeneration: { type: integer, minimum: 0 }
          additionalProperties: false
      additionalProperties: false
    ConfigBundlePlanResponse:
      type: object
      required: [plan, requestId]
      properties:
        plan:
          type: object
          required: [valid, digest, services]
          properties:
            valid: { type: boolean }
            digest: { type: string }
            services:
              type: array
              items:
                type: object
                required: [id, currentRevision, currentDigest, schemaVersion]
                properties:
                  id: { type: string }
                  currentRevision: { type: integer, minimum: 0 }
                  currentDigest: { type: string }
                  schemaVersion: { type: integer, minimum: 0 }
                additionalProperties: false
            warnings: { type: array, items: { type: string } }
          additionalProperties: false
        requestId: { type: string }
      additionalProperties: false
    ConfigBundleApplyResponse:
      type: object
      required: [operations, requestId]
      properties:
        operations: { type: array, items: { type: string, minLength: 1 } }
        requestId: { type: string }
      additionalProperties: false
    PluginInstance:
      type: object
      required: [id, state, desiredGeneration, appliedGeneration]
      properties:
        id: { type: string }
        state: { type: string }
        manifestDigest: { type: string }
        releaseDigest: { type: string }
        desiredGeneration: { type: integer, minimum: 0 }
        appliedGeneration: { type: integer, minimum: 0 }
        replicas: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: false
    PluginList:
      type: object
      required: [items, nextCursor, requestId]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PluginInstance' } }
        nextCursor: { type: [string, 'null'] }
        requestId: { type: string }
      additionalProperties: false
    PeerLinkPolicyList:
      type: object
      required: [items, nextCursor, requestId]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PeerLinkPolicy' } }
        nextCursor: { type: [string, 'null'] }
        requestId: { type: string }
      additionalProperties: false
    PeerLinkPolicy:
      type: object
      required: [callerInstanceId, targetInstanceId, revision, rules]
      properties:
        callerInstanceId: { type: string, minLength: 1, maxLength: 256 }
        targetInstanceId: { type: string, minLength: 1, maxLength: 256 }
        revision: { type: integer, minimum: 1 }
        rules: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PeerLinkRule' } }
      additionalProperties: false
    PeerLinkPolicyCreate:
      type: object
      required: [callerInstanceId, targetInstanceId, rules]
      properties:
        callerInstanceId: { type: string, minLength: 1, maxLength: 256 }
        targetInstanceId: { type: string, minLength: 1, maxLength: 256 }
        rules:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/PeerLinkRule' }
      additionalProperties: false
      description: >-
        Создать logical-pair policy. Instance IDs могут ещё не быть
        зарегистрированы; Core не раскрывает их endpoints, если для пары нет
        разрешённого live peer-directory entry.
    PeerLinkPolicyReplace:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/PeerLinkRule' }
      additionalProperties: false
    PeerLinkRule:
      type: object
      required: [placementRule, carrier, weight]
      properties:
        placementRule: { type: string, enum: [same-placement, remote] }
        carrier: { type: string, enum: [tcp, quic, unix, windows-named-pipe] }
        weight: { type: integer, minimum: 1, maximum: 100 }
        requiredContracts:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/PeerContractRange' }
      additionalProperties: false
      description: >-
        Core validates only generic syntax and placement/carrier pairing:
        same-placement permits unix/windows-named-pipe; remote permits tcp/quic.
        Duplicate placement/carrier pairs are rejected.
    PeerContractRange:
      type: object
      required: [contractId, minimumVersion, maximumVersionExclusive]
      properties:
        contractId: { type: string, minLength: 1, maxLength: 256 }
        minimumVersion: { type: string, minLength: 1, maxLength: 64 }
        maximumVersionExclusive: { type: string, minLength: 1, maxLength: 64 }
      additionalProperties: false
      description: Opaque plugin-owned contract compatibility claim; Core carries but does not interpret versions.
    AdminSurfaceList:
      type: object
      required: [items, requestId]
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
        requestId: { type: string }
      additionalProperties: false
    PluginSettings:
      type: object
      required: [revision, config]
      properties:
        revision: { type: string }
        digest: { type: string }
        config: { type: object, additionalProperties: true }
      additionalProperties: false
    PluginSettingsInput:
      type: object
      required: [config]
      properties:
        config: { type: object, additionalProperties: true }
      additionalProperties: false
    OperationAccepted:
      type: object
      required: [operationId, state, requestId]
      properties:
        operationId: { type: string }
        state: { $ref: '#/components/schemas/OperationAcceptedState' }
        requestId: { type: string }
      additionalProperties: false
    OperationAcceptedState:
      type: string
      enum: [pending, running]
    OperationState:
      type: string
      enum: [pending, running, succeeded, failed, degraded]
    Operation:
      type: object
      required: [id, kind, state, createdAt, requestId]
      properties:
        id: { type: string }
        kind: { type: string }
        state: { $ref: '#/components/schemas/OperationState' }
        resourceId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        requestId: { type: string }
        errorCode:
          type: string
          description: Safe code from the Core error catalog; absent unless state is failed or degraded.
      additionalProperties: false
    AuditPage:
      type: object
      required: [items, nextCursor, requestId]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditRecord' } }
        nextCursor: { type: [string, 'null'] }
        requestId: { type: string }
      additionalProperties: false
    AuditRecord:
      type: object
      required: [timestamp, actor, action, resource, result, requestId]
      properties:
        timestamp: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        resource: { type: string }
        result: { type: string }
        requestId: { type: string }
        beforeDigest: { type: string }
        afterDigest: { type: string }
      additionalProperties: false
    ServiceKeyCreateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
      additionalProperties: false
    ServiceKeyMetadata:
      type: object
      required: [id, name, role, createdAt, expiresAt, revokedAt]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, const: platform-admin }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
      additionalProperties: false
    ServiceKeyList:
      type: object
      required: [items, requestId]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ServiceKeyMetadata' } }
        requestId: { type: string }
      additionalProperties: false
    ServiceKeyIssued:
      type: object
      required: [id, name, role, token, requestId]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, const: platform-admin }
        token: { type: string, writeOnly: true }
        requestId: { type: string }
      additionalProperties: false
    Problem:
      type: object
      description: >-
        RFC 9457 problem details расширяется обязательными code и requestId.
        Detail и title берутся из безопасного error catalog; secrets, paths,
        raw plugin messages и payloads запрещены.
      required: [type, title, status, code, detail, instance, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        path:
          type: string
          description: Optional diagnostic request path; не содержит query или credentials.
        requestId: { type: string }
      additionalProperties: false
