version: 3
workdir: internal
allow:
  depOnAnyVendor: false
  deepScan: true
components:
  domain: { in: domain/** }
  application: { in: application/** }
  infrastructure: { in: infrastructure/** }
  presentation: { in: presentation/** }
vendors:
  yaml: { in: [gopkg.in/yaml.v3] }
commonVendors: []
deps:
  domain:
    mayDependOn: []
  application:
    mayDependOn: [domain]
  infrastructure:
    mayDependOn: [domain]
  presentation:
    mayDependOn: [application, domain, infrastructure]
    canUse: [yaml]
