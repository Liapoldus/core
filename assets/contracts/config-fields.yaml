root:
  - state
  - management
  - pluginControl
state:
  - path
management:
  - listen
  - tls
  - requestLimits
managementBootstrap:
  section: management
  listen: listen
  tls: tls
  clientCA: clientCA
managementTLS:
  - certificate
  - key
  - clientCA
managementRequestLimits:
  - maxBodyBytes
  - headerTimeout
  - requestTimeout
pluginControl:
  - listen
  - publicURL
  - tls
pluginControlTLS:
  - certificate
  - key
  - replicaClientCA
secretReference:
  filePrefix: "file:"
unknownFieldPolicy: reject
semantics:
  minimalBootstrapOnly: |
    Этот YAML содержит путь state, bind/TLS/trust Management API и bind/TLS/trust приватного plugin control listener для exact-generation config pull. Plugin settings, plugin endpoints, identities и traffic configuration задаются через Management API.
  localStorageOnly: |
    SQLite и immutable artifact store размещаются на локальной файловой системе. Сетевые database mounts не поддерживаются.
  managementRemoteSecurity: |
    Вне loopback Management API требует private network/VPN, TLS, mTLS и Bearer service key роли platform-admin.
codes:
  unknownField: unknown_field
  bootstrapInvalid: bootstrap_invalid
