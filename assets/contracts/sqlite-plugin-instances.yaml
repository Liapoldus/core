selectInstances: "SELECT instances.id, instances.mode, instances.state, active.generation, instances.manifest_json, active.raw_json FROM plugin_instances AS instances JOIN plugin_config_generations AS active ON active.instance_id = instances.id AND active.slot = 'active' ORDER BY instances.id"
validModes:
  - remote
validStates:
  - configured
  - ready
  - degraded
  - failed
json:
  id: id
  mode: mode
  state: state
  revision: revision
diagnostics:
  invalidContract: plugin inventory contract is invalid
  invalidRecord: plugin instance record is invalid
  invalidManifest: plugin instance manifest is invalid
