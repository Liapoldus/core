root:
  - state
  - artifacts
  - management
  - caddy
state:
  - path
artifacts:
  - path
management:
  - listen
  - tls
  - requestLimits
managementBootstrap:
  section: management
  listen: listen
  tls: tls
  clientCA: clientCA
managementTLS:
  - certificate
  - key
  - clientCA
managementRequestLimits:
  - maxBodyBytes
  - headerTimeout
  - requestTimeout
caddy:
  - variant
  - binary
  - expectedBuildID
caddyVariant:
  embedded: embedded
  external: external
secretReference:
  filePrefix: "file:"
unknownFieldPolicy: reject
semantics:
  minimalBootstrapOnly: |
    Этот YAML содержит пути state/artifacts, Management API bind/TLS/trust и вариант Caddy. Traffic routes, sites, plugin settings и listener definitions задаются вне YAML.
  localStorageOnly: |
    SQLite и immutable artifact store размещаются на локальной файловой системе. Сетевые database mounts не поддерживаются.
  managementRemoteSecurity: |
    Вне loopback Management API требует private network/VPN, TLS, mTLS и Bearer service key роли platform-admin.
  caddyVariant: |
    External binary обязан иметь совместимый Liapoldus module manifest и Caddy-L4; несовместимая сборка отклоняется без downgrade.
codes:
  unknownField: unknown_field
  bootstrapInvalid: bootstrap_invalid
  caddyBuildIncompatible: caddy_build_incompatible
