insertRevision: "INSERT INTO group_revisions(id, group_id, caddyfile_digest, artifact_digest, caddyfile_path, artifact_path, actor) VALUES(?, ?, ?, ?, ?, ?, ?)"
selectRevision: "SELECT id, group_id, caddyfile_digest, artifact_digest, caddyfile_path, artifact_path, created_at, actor FROM group_revisions WHERE group_id = ? AND id = ?"
