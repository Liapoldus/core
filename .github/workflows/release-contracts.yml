name: Release Core contracts

on:
  push:
    tags:
      - "core-v*"

permissions:
  contents: write

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify versioned contracts
        run: node scripts/verify-contract-bundle.mjs contracts/v1
      - name: Package contracts
        run: tar -czf "liapoldus-core-contracts-${GITHUB_REF_NAME#core-}.tar.gz" -C contracts v1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: liapoldus-core-contracts-*.tar.gz
