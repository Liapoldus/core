name: Verify Core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - name: Checkout plugin-sdk
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/plugin-sdk
          path: plugin-sdk
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
      - name: Configure Core and Plugin SDK workspace
        run: |
          go work init ./core ./plugin-sdk
          go work edit -go=1.26.0 go.work
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/tests/package-lock.json
      - name: Build Core
        run: make build
        working-directory: core
      - name: Run TypeScript test suite
        run: npm --prefix tests ci && make test
        working-directory: core
      - name: Go race and shutdown acceptance
        run: make test-race
        working-directory: core
      - name: Docker smoke
        run: make docker-smoke
        working-directory: core
      - name: Enforce architecture
        run: make arch-lint
        working-directory: core
